# yaml-language-server: $schema=https://github.com/epics-containers/ibek/releases/download/3.0.1/ibek.support.schema.json

# Measurement Computing multifunction DAQ modules through measComp's
# drvMultiFunction over uldaq (README "measComp"). One entity per module: the
# driver and the module's stock database (upstream's <model>.substitutions).

module: measComp

entity_models:
  - name: MultiFunction
    description: |-
      One MCC multifunction module (USB-1808X, USB-1608G, E-1608, ...) as an
      asyn port with upstream's records for its model: analog in and out,
      digital I/O and direction, counters, pulse generators, the waveform
      digitizer and generator. What a start sends: README "What the driver
      sends at start".
    parameters:
      name:
        type: id
        description: |-
          The asyn port name
      unique_id:
        type: str
        description: |-
          The module's serial number for USB (lsusb's iSerial, e.g. 01E87A66);
          its MAC or IP address for Ethernet
      P:
        type: str
        description: |-
          PV prefix, with its trailing colon
      model:
        type: str
        description: |-
          The module's upstream substitutions file, without its extension:
          USB1808 for the USB-1808 and USB-1808X, USB1608G, E1608, ...
          ($(MEASCOMP)/db). It also selects the post-init lines (the
          waveform digitizer and generator records exist only for some
          models). Not USBCTR: the USB-CTR driver is not built
      substitutions:
        type: str
        description: |-
          A substitutions file of the instance's own (a path in the container,
          e.g. /epics/ioc/config/<ioc>.substitutions) to load instead of
          upstream's <model>.substitutions; empty: upstream's. Upstream's
          USB1808.substitutions scales its analog inputs with the USB-1608G's
          range table (README "The entity")
        default: ""
      wdig_points:
        type: int
        description: |-
          Waveform digitizer points per channel (upstream's examples: 1048576;
          the arrays are allocated whether the digitizer runs or not)
        default: 16384
      wgen_points:
        type: int
        description: |-
          Waveform generator points per channel
        default: 16384
      outputs_pini:
        type: enum
        description: |-
          PINI of the analog output values (Ao*) and the binary outputs (Bo*).
          YES (upstream) writes each value (0) at iocInit; NO leaves the analog
          outputs as the module holds them until a put (the records read 0
          until written: uldaq has no output readback). Either way the DIO
          direction records (Bd*, PINI YES, VAL 0) set every DIO bit to input
          at each start, releasing any digital output. The macro is passed
          only for NO, so the port-wide longout keeps upstream's NO
        default: "YES"
        values:
          "YES":
          "NO":

    pre_init:
      - value: |
          # MultiFunctionConfig(portName, uniqueID, maxInputPoints, maxOutputPoints)
          MultiFunctionConfig("{{name}}", "{{unique_id}}", {{wdig_points}}, {{wgen_points}})
          dbLoadTemplate("{{substitutions or '/epics/support/measComp/db/' ~ model ~ '.substitutions'}}", "P={{P}},PORT={{name}},WDIG_POINTS={{wdig_points}},WGEN_POINTS={{wgen_points}}{% if outputs_pini == 'NO' %},PINI=NO{% endif %}")

    # The time arrays are I/O Intr and asynPortDriver does no array callbacks
    # before iocInit (upstream's st.cmd)
    # (only for the models whose upstream substitutions load them)
    post_init:
      - value: |
          {% if model in ['USB1808', 'USB1608G', 'USB1608G_2AO', 'USB1608HS_2AO', 'USB2408', 'E1608'] %}dbpf {{P}}WaveDigDwell.PROC 1{% endif %}
          {% if model in ['USB1808', 'USB1608G_2AO', 'USB1608HS_2AO', 'USB2408'] %}dbpf {{P}}WaveGenUserDwell.PROC 1{% endif %}
