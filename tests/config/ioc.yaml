# yaml-language-server: $schema=https://github.com/epics-containers/ioc-template-example/releases/latest/download/ibek.ioc.schema.json

ioc_name: "{{ ioc_yaml_file_name }}"

description: Very generic instance for testing generic IOCs

entities:
  - type: epics.EpicsEnvSet
    name: EPICS_TZ
    value: "GMT0BST"

  - type: devIocStats.iocAdminSoft
    IOC: "{{ ioc_name | upper }}"

  - type: epics.StartupCommand
    command: dbLoadRecords("/epics/ioc/config/ioc.db")

  - type: epics.dbpf
    pv: EXAMPLE:IBEK:A
    value: "2.54"

  - type: epics.dbpf
    pv: EXAMPLE:IBEK:B
    value: "2.61"

  - type: epics.PostStartupCommand
    command: |
      dbgf EXAMPLE:IBEK:SUM

  # NI USB-621x on the fake (no hardware, no firmware): AO1 loops back to
  # AI2 (Ao2 -> Ai3, and WaveDig3 in a timed scan) and P1.0 to P0.0
  # (Bo1 -> Bi1); run-tests.sh checks them
  - type: niusb.USB621x
    name: NI1
    P: "NITEST:"
    model: USB6211
    simulate: true

  # and a 6210 (no AO), so its entity branch and substitutions load
  - type: niusb.USB621x
    name: NI2
    P: "NITEST2:"
    model: USB6210
    simulate: true

  # and a USB-6008 on its fake: AO0 -> AI0 (Ao1 -> Ai1), P1.0 -> P0.0 (Bo1 -> Bi1;
  # 0, since an undriven line reads high)
  - type: niusb.USB6008
    name: NI3
    P: "NITEST3:"
    simulate: true

  - type: epics.PostStartupCommand
    command: |
      # let iocInit's PINI writes finish first: without this wait, on a slow
      # runner, the WaveDig puts below were seen not to reach the driver
      # (WaveDig3 empty, NumChans showing 3); the exact path is not traced
      epicsThreadSleep 3
      dbpf NITEST3:Ao1 2.5
      dbpf NITEST3:Bo1 0
      dbpf NITEST3:WaveDigNumChans 2
      dbpf NITEST3:WaveDigNumPoints 100
      dbpf NITEST3:WaveDigRun 1
      dbpf NITEST:Ao2 2.5
      dbpf NITEST:Bo1 1
      dbpf NITEST:WaveDigNumChans 3
      dbpf NITEST:WaveDigNumPoints 100
      dbpf NITEST:WaveDigRun 1
      epicsThreadSleep 2.5
      dbgf NITEST:Ai3
      dbgf NITEST:Bi1
      dbgf NITEST:Model
      dbgf NITEST:WaveDig3
      dbgf NITEST2:Model
      dbgf NITEST2:Ai4
      dbgf NITEST3:Ai1
      dbgf NITEST3:Bi1
      dbgf NITEST3:Model
      dbgf NITEST3:WaveDig1
